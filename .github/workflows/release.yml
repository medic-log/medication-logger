name: Release

# Push a tag matching the app's versionName, e.g. `git tag v0.1.0 && git push origin v0.1.0`
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

# One Pages deploy at a time, so an older release never overwrites a newer one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Check tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Decode keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is not set, see CONTRIBUTING.md"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "medication-logger-$GITHUB_REF_NAME.apk"
          # Without the version in its name, so /releases/latest/download/medication-logger.apk always works
          cp app/build/outputs/apk/release/app-release.apk medication-logger.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "medication-logger-$GITHUB_REF_NAME.apk" medication-logger.apk --generate-notes

      # The download site: site/index.html plus the release's APK and latest.json, which the app's Update button reads
      - name: Build download site
        run: |
          version_code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          mkdir -p _site
          cp site/index.html medication-logger.apk _site/
          jq -n \
            --argjson versionCode "$version_code" \
            --arg versionName "${GITHUB_REF_NAME#v}" \
            --arg sha256 "$(sha256sum medication-logger.apk | cut -d' ' -f1)" \
            '{versionCode: $versionCode, versionName: $versionName, apk: "medication-logger.apk", sha256: $sha256}' \
            > _site/latest.json

      - uses: actions/upload-pages-artifact@v4

  deploy-site:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
